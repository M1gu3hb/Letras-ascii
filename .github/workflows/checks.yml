name: Editor checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps webkit
      - name: Virtual audio output
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio pulseaudio-utils gstreamer1.0-pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=letras_ci rate=44100 channels=2
          pactl set-default-sink letras_ci
      - run: npm run build
      - name: WebKit regression suites
        run: |
          set +e
          timeout --kill-after=10s 360s dbus-run-session -- xvfb-run -a node scripts/test-browser.mjs smoke reliability reaudit mobile-capture adjust reading audit-boundaries 2>&1 | tee /tmp/letras-webkit-checks.log
          test_status=${PIPESTATUS[0]}
          exit "$test_status"
        env:
          PLAYWRIGHT_BROWSER: webkit
          PLAYWRIGHT_HEADLESS: 'false'
      - name: Report WebKit failure context
        if: failure()
        run: |
          node --input-type=module <<'NODE'
          import {existsSync, readFileSync} from 'node:fs';
          const path='/tmp/letras-webkit-checks.log';
          if(existsSync(path)) {
            const tail=readFileSync(path,'utf8').trim().split('\n').slice(-35).join('\n');
            const escaped=tail.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A');
            console.error('::error title=WebKit last test output::'+escaped);
          }
          NODE
