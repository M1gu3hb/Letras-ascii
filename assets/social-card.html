<!doctype html><html lang="es"><meta charset="utf-8"><title>Tarjeta social de Letras en ASCII</title><style>
@font-face{font-family:Nunito;font-weight:900;src:url(fonts/nunito-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:Nunito;font-weight:700;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Mono;font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;color:#eef2ff;font-family:Nunito,Arial,sans-serif;padding:64px 72px;overflow:hidden;position:relative;background:radial-gradient(90% 120% at 85% 10%,#1a3be0 0%,#0b1740 38%,#03050b 72%)}
.ascii{position:absolute;inset:0;font:400 15px/18px Mono,monospace;color:rgba(143,182,255,.13);white-space:pre;overflow:hidden;letter-spacing:2px}
.brand{position:relative;font-size:28px;font-weight:900;display:flex;align-items:center;gap:16px}.icon{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#1238ff,#2f5bff 55%,#6a8dff);box-shadow:0 12px 36px -10px rgba(47,91,255,.9);display:grid;place-items:center}
h1{position:relative;font-size:84px;font-weight:900;line-height:1.04;letter-spacing:-2px;margin:62px 0 24px;max-width:1000px}h1 span{background:linear-gradient(90deg,#5a7dff,#a9c4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
p{position:relative;font-size:28px;font-weight:700;color:#a9b6dc;margin:0 0 34px}.tags{position:relative;display:flex;gap:14px}.tags span{font-size:20px;font-weight:700;border:1px solid #2a3b78;background:rgba(11,17,33,.8);padding:12px 20px;border-radius:999px}
.url{position:absolute;bottom:46px;right:72px;font-size:21px;font-weight:700;color:#8fb6ff}
</style><body><div class="ascii" id="a"></div><div class="brand"><span class="icon"><svg width="24" height="24" viewBox="0 0 24 24"><path fill="#fff" d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20Z"/></svg></span>Letras en ASCII</div><h1>Tu canción, su letra<br><span>y un detalle que late.</span></h1><p>Sincroniza, diseña y mándalo en un solo archivo.</p><div class="tags"><span>Reacciona a la música</span><span>Funciona sin internet</span><span>Todo en tu dispositivo</span></div><div class="url">letras-ascii.vercel.app</div>
<script>const c=' .:-=+*#%@',r=[];for(let y=0;y<36;y++){let l='';for(let x=0;x<110;x++){const v=Math.sin(x*.21+y*.13)*Math.cos(y*.27-x*.05);l+=c[Math.max(0,Math.min(9,Math.floor((v+1)*4.6)))]}r.push(l)}document.getElementById('a').textContent=r.join('\n')</script></body></html>
